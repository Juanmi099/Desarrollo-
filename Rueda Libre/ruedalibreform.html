<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar | Rueda Libre</title>
    <link rel="icon" href="img/icono.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="ruedalibre.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

     <nav class="navbar navbarnegro">
        <div class="container">
            <a href="ruedalibre.html">
                <img src="/img/logo-blanco.png" alt="Rueda Libre" height="40">
            </a>
            <div>
                <a href="ruedalibre.html" class="text-white me-3">Inicio</a>
                <a href="tarifas.html" class="text-white me-3">Tarifas</a>
                <a href="ruedalibreform.html" class="text-white">Reservar</a>
                <a href="/Rueda Libre/index.html" class="text-white">  Rueda Nocturna</a>
            </div>
        </div>
    </nav>
    <main class="bg-primary text-center py-5 flex -grow-1">
         <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">

                    <h1 class="mb-4">Reserva tu bicicleta</h1>

                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" id="correo" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" id="telefono" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="modelo" class="form-label">Bicicleta</label>
                            <select id="modelo" class="form-select" required>
                                <option value="">Elige una bicicleta</option>
                                <option>Urbana Clásica - $10.000 por hora</option>
                                <option>Urbana Plegable - $12.000 por hora</option>
                                <option>Montaña Trail - $15.000 por hora</option>
                                <option>Gravel Aventura - $18.000 por hora</option>
                                <option>Eléctrica Urbana - $25.000 por hora</option>
                                <option>Infantil - $8.000 por hora</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" id="fecha" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="horas" class="form-label">¿Cuántas horas?</label>
                            <input type="number" id="horas" class="form-control" min="1" value="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="cantidad" class="form-label">¿Cantidad de Bicicletas?</label>
                            <input type="number" id="cantidad" class="form-control" min="1" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label for="Comentarios" class="form-label">Comentarios</label>
                            <textarea class="form-control" id="Comentarios" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Enviar reserva</button>
                   
                    </form>
                    

                </div>
            </div>
        </div>
        <div class="container my-5">
            <p class="text-center"> Informacion de Contacto: Cl. 16 #55-129, Guayabal,
                Medellín, Antioquia
                <br> Teléfono: 123-456-7890 <br> Correo: info@ruedalibre.com
            </p>
        </div>
    </main>



     <footer class="navbarnegro text-white text-center p-3">
        © Rueda Libre - Medellín
    </footer>

</body>

</html>
