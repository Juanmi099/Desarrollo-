<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Mi Portafolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>

          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <header class="page-header">
      <div class="container">
        <h1 class="titulo-seccion display-4"><span class="text-dorado">Contacto</span></h1>
        <hr class="linea-dorada mt-3">
        <p class="text-suave fs-5 mb-0">¿Tienes una propuesta o una pregunta? Escríbeme.</p>
      </div>
    </header>

    <section class="seccion pt-4">
      <div class="container">
        <div class="row g-5">
          <!-- Información personal -->
          <div class="col-lg-5">
            <h2 class="h3 mb-4">Mi <span class="text-dorado">información</span></h2>

            <div class="dato-contacto">
              <div class="icono-circulo"><i class="bi bi-envelope"></i></div>
              <div>
                <div class="text-suave small">Correo</div>
                <a href="mailto:tucorreo@ejemplo.com">Juanmiguellopezcardonaz09@gmail.com</a>
              </div>
            </div>

            <div class="dato-contacto">
              <div class="icono-circulo"><i class="bi bi-telephone"></i></div>
              <div>
                <div class="text-suave small">Teléfono</div>
                <a href="tel:+570000000000">+57 301 382 4604</a>
              </div>
            </div>

            <div class="dato-contacto">
              <div class="icono-circulo"><i class="bi bi-whatsapp"></i></div>
              <div>
                <div class="text-suave small">WhatsApp</div>
                <a href="https://wa.me/573013824604" target="_blank" rel="noopener">Escríbeme por WhatsApp</a>
              </div>
            </div>

            <div class="dato-contacto">
              <div class="icono-circulo"><i class="bi bi-geo-alt"></i></div>
              <div>
                <div class="text-suave small">Ubicación</div>
                <span>Medellin, Colombia</span>
              </div>
            </div>

            <div class="redes mt-4">
             
              <a href="https://www.instagram.com/juan_mi_09/" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
              <a href="https://github.com/Juanmi099" aria-label="GitHub"><i class="bi bi-github"></i></a>
            </div>
          </div>

          <!-- Formulario -->
          <div class="col-lg-7">
            <div class="card tarjeta p-4">
              <form action="mailto:tucorreo@ejemplo.com" method="post" enctype="text/plain">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="Nombre" placeholder="Tu nombre" required>
                  </div>
                  <div class="col-md-6">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo" name="Correo" placeholder="tu@correo.com" required>
                  </div>
                  <div class="col-12">
                    <label for="asunto" class="form-label">Asunto</label>
                    <input type="text" class="form-control" id="asunto" name="Asunto" placeholder="¿De qué se trata?">
                  </div>
                  <div class="col-12">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" name="Mensaje" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-dorado w-100">
                      <i class="bi bi-send me-2"></i>Enviar mensaje
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

  <footer>

      <p class="mb-0">&copy; 2026 <span class="text-dorado">Juan Miguel</span>. .</p>
